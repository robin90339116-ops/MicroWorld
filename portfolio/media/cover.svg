<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
  <title id="title">MicroWorld 微世界产品案例封面</title>
  <desc id="desc">从线下相遇、双方确认到建立连接与保留纪念。抽象产品示意，不是真机截图。</desc>
  <rect width="1400" height="660" rx="28" fill="#F4F3EC"/>
  <path d="M890 0H1400V660H1120C975 520 1220 354 1060 200Z" fill="#E5EAE0"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="64" y="54" width="257" height="36" rx="18" fill="#DFE8DE"/>
    <text x="83" y="78" font-size="15" letter-spacing="2" fill="#315749">PRODUCT CASE · 产品案例</text>
    <text x="64" y="175" font-size="57" font-weight="700" fill="#173D32">MicroWorld 微世界</text>
    <text x="64" y="247" font-size="36" font-weight="600" fill="#173D32">把一次线下相遇，</text>
    <text x="64" y="300" font-size="36" font-weight="600" fill="#173D32">变成有共同来源的连接。</text>
    <text x="66" y="354" font-size="19" fill="#5E7167">个人连接 × 商家到店评价</text>
    <text x="66" y="385" font-size="19" fill="#5E7167">产品定义 / 规则取舍 / 交付验证</text>
    <g transform="translate(905 137)">
      <circle cx="170" cy="155" r="147" fill="none" stroke="#BBCBBE" stroke-width="1.5"/>
      <circle cx="170" cy="155" r="112" fill="none" stroke="#BBCBBE" stroke-width="1.5" stroke-dasharray="5 8"/>
      <rect x="4" y="78" width="145" height="200" rx="24" fill="#173D32" transform="rotate(-9 77 178)"/>
      <rect x="192" y="26" width="145" height="200" rx="24" fill="#EBA86C" transform="rotate(9 265 126)"/>
      <circle cx="112" cy="151" r="30" fill="#F4F3EC"/>
      <circle cx="228" cy="151" r="30" fill="#F4F3EC"/>
      <path d="M138 151H201" stroke="#F4F3EC" stroke-width="10" stroke-linecap="round"/>
      <path d="m101 150 8 9 15-18m93 9 8 9 15-18" fill="none" stroke="#173D32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="170" y="310" text-anchor="middle" font-size="20" fill="#315749">靠近不是同意，确认才是。</text>
    </g>
    <line x1="66" y1="470" x2="1334" y2="470" stroke="#CFD8CC"/>
    <g fill="#173D32">
      <text x="66" y="519" font-size="15" fill="#7A8B7D">01</text><text x="66" y="554" font-size="24" font-weight="600">线下相遇</text>
      <text x="386" y="519" font-size="15" fill="#7A8B7D">02</text><text x="386" y="554" font-size="24" font-weight="600">双方确认</text>
      <text x="706" y="519" font-size="15" fill="#7A8B7D">03</text><text x="706" y="554" font-size="24" font-weight="600">继续交流</text>
      <text x="1026" y="519" font-size="15" fill="#7A8B7D">04</text><text x="1026" y="554" font-size="24" font-weight="600">保留共同经历</text>
    </g>
    <text x="66" y="615" font-size="14" fill="#6B7A70">HarmonyOS 原型 · 实现与验证阶段</text>
    <text x="1334" y="615" text-anchor="end" font-size="14" fill="#6B7A70">方案示意，非真机截图</text>
